services:
  db:
    image: postgres:17
    container_name: todo_db
    restart: always
    environment:
      POSTGRES_DB: Todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: F1ette20@
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Todo"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: todo_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/Todo
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=F1ette20@
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
