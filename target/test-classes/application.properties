# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT
# Base64 of "testSecretKeyForTestingPurposesOnlyNotForProductionUse1234567890AB" (66 bytes = 528 bits >= 512 required for HS512)
todo.app.jwtSecret=dGVzdFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHlOb3RGb3JQcm9kdWN0aW9uVXNlMTIzNDU2Nzg5MEFC
todo.app.jwtExpirationMs=86400000

# Mail (JavaMailSender is mocked in tests, these just prevent auto-config errors)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Frontend URL
app.frontend-url=http://localhost:3000
